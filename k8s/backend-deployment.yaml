apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenecraft-backend
  namespace: scenecraft
  labels:
    app: scenecraft-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scenecraft-backend
  template:
    metadata:
      labels:
        app: scenecraft-backend
    spec:
      containers:
        - name: backend
          image: scenecraft/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: scenecraft-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: scenecraft-backend
  namespace: scenecraft
spec:
  selector:
    app: scenecraft-backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
