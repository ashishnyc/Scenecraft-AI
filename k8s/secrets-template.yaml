  ANTHROPIC_API_KEY: "REPLACE_ME"
  ELEVENLABS_API_KEY: "REPLACE_ME"
  KLING_API_KEY: "REPLACE_ME"
  SUNO_API_KEY: "REPLACE_ME"
  IMAGE_GEN_API_KEY: "REPLACE_ME"
  YOUTUBE_API_KEY: "REPLACE_ME"
