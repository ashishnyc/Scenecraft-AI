apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenecraft-temporal-worker
  namespace: scenecraft
  labels:
    app: scenecraft-temporal-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scenecraft-temporal-worker
  template:
    metadata:
      labels:
        app: scenecraft-temporal-worker
    spec:
      containers:
        - name: temporal-worker
          image: scenecraft/backend:latest
          command: ["python", "-m", "app.services.temporal_worker"]
          envFrom:
            - secretRef:
                name: scenecraft-secrets
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
